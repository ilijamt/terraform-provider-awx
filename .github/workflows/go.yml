name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.15.8
  TOFU_VERSION: 1.12.5

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Display Go version
        run: go version
      - name: Test
        run: |
          mkdir -p covdata/unit
          go test ./internal/... -count=1 -cover -coverpkg=./internal/... -v \
            -args -test.gocoverdir=$PWD/covdata/unit
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: covdata-unit
          path: covdata/unit
          if-no-files-found: error

  integration:
    name: Integration / Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Run integration suite (replay)
        run: make test-integration-cover COVERDIR=covdata/terraform
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: covdata-integration-terraform
          path: covdata/terraform
          if-no-files-found: error

  integration-opentofu:
    name: Integration / OpenTofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Run integration suite (replay)
        run: make test-integration-cover TF=tofu COVERDIR=covdata/opentofu
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: covdata-integration-opentofu
          path: covdata/opentofu
          if-no-files-found: error

  coverage:
    needs: [unit, integration, integration-opentofu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          path: covdata
          pattern: covdata-*
      - name: Merge coverage profiles
        run: |
          set -euo pipefail
          ls -la covdata
          inputs=$(find covdata -mindepth 1 -maxdepth 1 -type d | paste -sd, -)
          mkdir -p covdata-merged
          go tool covdata merge -i="$inputs" -o=covdata-merged
          go tool covdata textfmt -i=covdata-merged -o=coverage.out
          go tool cover -func=coverage.out | tail -n 1
      - name: Upload coverage reports to Codecov
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Display Go version
        run: go version
      - name: Build
        run: go build -v ./cmd/provider
